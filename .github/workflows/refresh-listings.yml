# Refreshes the for-sale listings every morning and redeploys the GitHub Pages site.
# Run it by hand any time: GitHub → Actions → "Refresh land listings" → Run workflow.
name: Refresh land listings

on:
  schedule:
    - cron: "17 10 * * *"   # daily, about 6:17 am Eastern
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed data
  pages: write      # ask GitHub Pages to rebuild

concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      # Elevation, soils, roads and parcel downloads rarely change: keep them between runs.
      - uses: actions/cache@v4
        with:
          path: pipeline/cache
          key: pipeline-cache-v1-${{ github.run_id }}
          restore-keys: pipeline-cache-v1-

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Rebuild listings and metrics
        run: ./pipeline/run_all.sh

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if git diff --cached --quiet; then
            echo "No listing changes today."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh land listings ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
